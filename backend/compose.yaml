services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: spona
      POSTGRES_USER: ${SPONA_DB_USER:-spona}
      POSTGRES_PASSWORD: ${SPONA_DB_PASSWORD:-spona}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${SPONA_DB_USER:-spona} -d spona']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${SPONA_S3_ACCESS_KEY:-spona}
      MINIO_ROOT_PASSWORD: ${SPONA_S3_SECRET_KEY:-spona-secret}
    ports:
      - '9000:9000'   # S3 API - the backend talks to this
      - '9001:9001'   # web console - ui to open in browser
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'   # SMTP - the backend sends here
      - '8025:8025'   # web inbox - read verification links here
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ['full']
    build: .
    ports:
      - '${SPONA_PORT:-8080}:8080'
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPONA_DB_URL: jdbc:postgresql://postgres:5432/spona
      SPONA_MAIL_HOST: mailpit
      SPONA_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
