# Serves the built app and forwards /api and /storage the way the Vite dev server does

resolver 127.0.0.11 valid=10s ipv6=off;

upstream spona_api {
    zone spona_api 64k;
    server backend:8080 resolve;
    server host.docker.internal:8080 backup;
}

upstream spona_storage {
    zone spona_storage 64k;
    server minio:9000 resolve;
}

# /storage/<bucket>/<key>?<query> -> /<bucket>/<key>?<query>, so presigned URLs keep their signature
map $request_uri $storage_uri {
    ~^/storage(?<rest>/.*)$ $rest;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 6m;   # spring.servlet.multipart.max-request-size

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://spona_api;
        proxy_set_header Host $http_host;
        proxy_set_header Origin "";   # same as vite.config.ts, so CORS holds from any host, a phone on the LAN too
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        proxy_pass http://spona_storage$storage_uri;
        proxy_set_header Host localhost:9000;   # the host SPONA_S3_PUBLIC_ENDPOINT signs presigned URLs for
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
